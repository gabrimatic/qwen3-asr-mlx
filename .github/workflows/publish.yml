name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: none

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require matching version and green CI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/qwen3_asr_mlx/__init__.py)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package version $version"
            exit 1
          fi
          green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful CI run for $GITHUB_SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Install pinned build tools
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: build==1.6.1 twine==7.0.0"

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
